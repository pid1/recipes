name: Build Recipes PDF

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d/ | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc texlive-xetex texlive-fonts-recommended texlive-latex-extra fonts-texgyre

      - name: Convert Markdown to PDF
        run: pandoc -f gfm -t pdf --pdf-engine=xelatex --template=template.tex -o recipes.pdf recipes.md
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: recipes-pdf
          path: recipes.pdf

      - name: Determine next release version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: version
        run: |
          git fetch --tags --quiet
          latest=$(git tag -l 'v[0-9]*' | sed 's/^v//' | sort -n | tail -1)
          next=$(( ${latest:-0} + 1 ))
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: recipes.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
